name: Anthropic IPO long-form voice

# Renders only the Noah narration for the Anthropic IPO long-form video and commits the audio back
# to this branch so the video can be rendered and checked before anything is made public. It never
# uploads to YouTube and does not touch main, content/ or the Shorts and story workflows.
on:
  push:
    branches: [cursor/anthropic-ipo-long-voice]
    paths:
      - .github/workflows/anthropic-ipo-long-voice.yml
      - video/anthropic-ipo-long/voice_long.json
      - video/anthropic-ipo-long/noah_voice_long.py

permissions:
  contents: write

concurrency:
  group: anthropic-ipo-long-voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install --quiet pillow num2words
      - name: Render Noah narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 video/anthropic-ipo-long/noah_voice_long.py
      - uses: actions/upload-artifact@v4
        with:
          name: anthropic-ipo-long-voice
          path: video/anthropic-ipo-long/out/
          retention-days: 14
      - name: Commit the audio to this branch
        run: |
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f video/anthropic-ipo-long/out
          git commit -qm "Anthropic IPO long-form: Noah narration" || exit 0
          git push -q origin HEAD:cursor/anthropic-ipo-long-voice
