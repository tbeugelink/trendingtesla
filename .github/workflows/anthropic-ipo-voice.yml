name: Anthropic IPO preview voice

# Renders only the Noah narration for the Anthropic IPO preview Short and commits the audio back to
# this branch so it can be checked before anything is made public. It never uploads to YouTube and
# does not touch main, content/ or the Shorts workflows.
on:
  push:
    branches: [cursor/anthropic-ipo-voice]
    paths:
      - .github/workflows/anthropic-ipo-voice.yml
      - video/anthropic-ipo/script.json
      - video/anthropic-ipo/noah_voice.py

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: pip install --quiet pillow num2words
      - name: Render Noah narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 video/anthropic-ipo/noah_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: anthropic-ipo-voice
          path: video/anthropic-ipo/out/
          retention-days: 14
      - name: Commit the audio to this branch
        run: |
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f video/anthropic-ipo/out
          git commit -qm "Anthropic IPO preview: Noah narration" || exit 0
          git push -q origin HEAD:cursor/anthropic-ipo-voice
