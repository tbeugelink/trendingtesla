name: Generate article photo

# By hand from the Actions tab: make a Nano Banana photo for an article that has a "gen_image" spec
# (new articles get theirs automatically in "Make YouTube videos").
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug, or 'test' to make the test images in ops/gen-tests.json (nothing is published)"
        required: true
      spec:
        description: "Test spec file (only with slug 'test')"
        required: false
        default: "ops/gen-tests.json"

permissions:
  contents: write

jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test images
        if: github.event.inputs.slug == 'test'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install --quiet pillow
          python3 tools/gen_image.py --test "${{ github.event.inputs.spec || 'ops/gen-tests.json' }}" gen-test
      - uses: actions/upload-artifact@v5
        if: github.event.inputs.slug == 'test'
        with:
          name: gen-test-${{ github.run_number }}
          path: gen-test/*.jpg
          retention-days: 14
      - name: Generate and publish
        if: github.event.inputs.slug != 'test'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install --quiet pillow
          python3 tools/gen_image.py "${{ github.event.inputs.slug }}"
          [ -z "$(git status --porcelain content static)" ] && exit 0
          python3 build.py > /dev/null
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content static PHOTOS.md public
          git commit -qm "Photo: new image for ${{ github.event.inputs.slug }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
