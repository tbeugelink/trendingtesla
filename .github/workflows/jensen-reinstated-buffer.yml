name: Post Jensen reinstated Short to Buffer

# One post of the reviewed Short to TikTok, Instagram and Facebook.
# A push of this file starts it once. It does not upload to YouTube and does not touch main.
on:
  workflow_dispatch:
  push:
    branches: [cursor/jensen-reinstated-short]
    paths:
      - .github/workflows/jensen-reinstated-buffer.yml
      - video/jensen-reinstated/buffer_once.py

permissions:
  contents: write

jobs:
  buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Release the file and post via Buffer
        env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SOCIAL_SERVICES: tiktok,instagram,facebook
        run: |
          f=video/jensen-reinstated/jensen-reinstated-short.mp4
          thumb=video/jensen-reinstated/jensen-reinstated-thumb-9x16.jpg
          tag=tiktok-jensen-reinstated-short
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$f" "$thumb" --title "TikTok: jensen-reinstated-short" \
              --notes "Video file for Buffer. Not a YouTube upload." --latest=false
          else
            gh release upload "$tag" "$f" "$thumb" --clobber
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          python3 video/jensen-reinstated/buffer_once.py \
            "$base/jensen-reinstated-short.mp4" \
            "$base/jensen-reinstated-thumb-9x16.jpg"
