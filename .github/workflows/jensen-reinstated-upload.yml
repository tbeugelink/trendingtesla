name: Upload Jensen reinstated Short

# One public upload of the already-reviewed Short.
# A push of this file starts it once. The file stays off main and is removed after the upload.
on:
  workflow_dispatch:
  push:
    branches: [cursor/jensen-reinstated-short]
    paths:
      - .github/workflows/jensen-reinstated-upload.yml
      - video/jensen-reinstated/upload_once.py

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Upload the reviewed file
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
        run: python3 video/jensen-reinstated/upload_once.py
