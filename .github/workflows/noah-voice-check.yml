name: Noah voice check

# Compares voice settings to Noah's id without printing their values, then
# renders one narration sample with the match. Does not change the plan.
on:
  push:
    branches: [cursor/noah-narration-voice-d0ac]
    paths:
      - .github/workflows/noah-voice-check.yml
      - video/noah_voice_check.py
      - video/voice-sample.txt

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Choose the voice setting that is Noah
        env:
          V_ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          S_ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          V_ELEVENLABS_VOICE_ID_2: ${{ vars.ELEVENLABS_VOICE_ID_2 }}
          S_ELEVENLABS_VOICE_ID_2: ${{ secrets.ELEVENLABS_VOICE_ID_2 }}
          V_ELEVENLABS_VOICE_ID_3: ${{ vars.ELEVENLABS_VOICE_ID_3 }}
          S_ELEVENLABS_VOICE_ID_3: ${{ secrets.ELEVENLABS_VOICE_ID_3 }}
          V_ELEVENLABS_VOICE_ID_NL: ${{ vars.ELEVENLABS_VOICE_ID_NL }}
          S_ELEVENLABS_VOICE_ID_NL: ${{ secrets.ELEVENLABS_VOICE_ID_NL }}
          V_ELEVENLABS_VOICE_ID_NOAH: ${{ vars.ELEVENLABS_VOICE_ID_NOAH }}
          S_ELEVENLABS_VOICE_ID_NOAH: ${{ secrets.ELEVENLABS_VOICE_ID_NOAH }}
          V_ELEVENLABS_VOICE_NOAH: ${{ vars.ELEVENLABS_VOICE_NOAH }}
          S_ELEVENLABS_VOICE_NOAH: ${{ secrets.ELEVENLABS_VOICE_NOAH }}
          V_ELEVENLABS_NOAH_VOICE_ID: ${{ vars.ELEVENLABS_NOAH_VOICE_ID }}
          S_ELEVENLABS_NOAH_VOICE_ID: ${{ secrets.ELEVENLABS_NOAH_VOICE_ID }}
          V_NOAH_VOICE_ID: ${{ vars.NOAH_VOICE_ID }}
          S_NOAH_VOICE_ID: ${{ secrets.NOAH_VOICE_ID }}
          V_ELEVENLABS_VOICE: ${{ vars.ELEVENLABS_VOICE }}
          S_ELEVENLABS_VOICE: ${{ secrets.ELEVENLABS_VOICE }}
          V_ELEVENLABS_DEFAULT_VOICE_ID: ${{ vars.ELEVENLABS_DEFAULT_VOICE_ID }}
          S_ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}
        run: |
          set -euo pipefail
          noah='9hb1f7xQcMLB90qbYSY3'
          chosen=""
          : > "$RUNNER_TEMP/voice-scan.txt"
          scan() {
            kind="$1"; name="$2"; val="$3"
            if [ -z "$val" ]; then
              echo "$kind $name EMPTY" | tee -a "$RUNNER_TEMP/voice-scan.txt"
            elif [ "$val" = "$noah" ]; then
              echo "$kind $name NOAH" | tee -a "$RUNNER_TEMP/voice-scan.txt"
            else
              echo "$kind $name DIFFERENT len=${#val}" | tee -a "$RUNNER_TEMP/voice-scan.txt"
            fi
          }
          scan var ELEVENLABS_VOICE_ID "$V_ELEVENLABS_VOICE_ID"
          scan secret ELEVENLABS_VOICE_ID "$S_ELEVENLABS_VOICE_ID"
          scan var ELEVENLABS_VOICE_ID_2 "$V_ELEVENLABS_VOICE_ID_2"
          scan secret ELEVENLABS_VOICE_ID_2 "$S_ELEVENLABS_VOICE_ID_2"
          scan var ELEVENLABS_VOICE_ID_3 "$V_ELEVENLABS_VOICE_ID_3"
          scan secret ELEVENLABS_VOICE_ID_3 "$S_ELEVENLABS_VOICE_ID_3"
          scan var ELEVENLABS_VOICE_ID_NL "$V_ELEVENLABS_VOICE_ID_NL"
          scan secret ELEVENLABS_VOICE_ID_NL "$S_ELEVENLABS_VOICE_ID_NL"
          scan var ELEVENLABS_VOICE_ID_NOAH "$V_ELEVENLABS_VOICE_ID_NOAH"
          scan secret ELEVENLABS_VOICE_ID_NOAH "$S_ELEVENLABS_VOICE_ID_NOAH"
          scan var ELEVENLABS_VOICE_NOAH "$V_ELEVENLABS_VOICE_NOAH"
          scan secret ELEVENLABS_VOICE_NOAH "$S_ELEVENLABS_VOICE_NOAH"
          scan var ELEVENLABS_NOAH_VOICE_ID "$V_ELEVENLABS_NOAH_VOICE_ID"
          scan secret ELEVENLABS_NOAH_VOICE_ID "$S_ELEVENLABS_NOAH_VOICE_ID"
          scan var NOAH_VOICE_ID "$V_NOAH_VOICE_ID"
          scan secret NOAH_VOICE_ID "$S_NOAH_VOICE_ID"
          scan var ELEVENLABS_VOICE "$V_ELEVENLABS_VOICE"
          scan secret ELEVENLABS_VOICE "$S_ELEVENLABS_VOICE"
          scan var ELEVENLABS_DEFAULT_VOICE_ID "$V_ELEVENLABS_DEFAULT_VOICE_ID"
          scan secret ELEVENLABS_DEFAULT_VOICE_ID "$S_ELEVENLABS_DEFAULT_VOICE_ID"
          mkdir -p video/out/noah-check
          cp "$RUNNER_TEMP/voice-scan.txt" video/out/noah-check/scan.txt
          # Workflows already pass the variable. Prefer it when it is Noah.
          pick() {
            if [ "$3" = "$noah" ]; then
              printf '%s' "$3" > "$RUNNER_TEMP/chosen-voice"
              echo "$1 $2" > video/out/noah-check/source.txt
              echo "SELECTED $1 $2"
              return 0
            fi
            return 1
          }
          pick var ELEVENLABS_VOICE_ID "$V_ELEVENLABS_VOICE_ID" \
            || pick secret ELEVENLABS_VOICE_ID "$S_ELEVENLABS_VOICE_ID" \
            || pick var ELEVENLABS_VOICE_ID_NOAH "$V_ELEVENLABS_VOICE_ID_NOAH" \
            || pick secret ELEVENLABS_VOICE_ID_NOAH "$S_ELEVENLABS_VOICE_ID_NOAH" \
            || pick var ELEVENLABS_VOICE_NOAH "$V_ELEVENLABS_VOICE_NOAH" \
            || pick secret ELEVENLABS_VOICE_NOAH "$S_ELEVENLABS_VOICE_NOAH" \
            || pick var NOAH_VOICE_ID "$V_NOAH_VOICE_ID" \
            || pick secret NOAH_VOICE_ID "$S_NOAH_VOICE_ID" \
            || pick var ELEVENLABS_NOAH_VOICE_ID "$V_ELEVENLABS_NOAH_VOICE_ID" \
            || pick secret ELEVENLABS_NOAH_VOICE_ID "$S_ELEVENLABS_NOAH_VOICE_ID" \
            || pick var ELEVENLABS_VOICE "$V_ELEVENLABS_VOICE" \
            || pick secret ELEVENLABS_VOICE "$S_ELEVENLABS_VOICE" \
            || pick var ELEVENLABS_DEFAULT_VOICE_ID "$V_ELEVENLABS_DEFAULT_VOICE_ID" \
            || pick secret ELEVENLABS_DEFAULT_VOICE_ID "$S_ELEVENLABS_DEFAULT_VOICE_ID" \
            || pick var ELEVENLABS_VOICE_ID_2 "$V_ELEVENLABS_VOICE_ID_2" \
            || pick secret ELEVENLABS_VOICE_ID_2 "$S_ELEVENLABS_VOICE_ID_2" \
            || pick var ELEVENLABS_VOICE_ID_3 "$V_ELEVENLABS_VOICE_ID_3" \
            || pick secret ELEVENLABS_VOICE_ID_3 "$S_ELEVENLABS_VOICE_ID_3" \
            || { printf '%s' "$noah" > "$RUNNER_TEMP/chosen-voice"; echo "code-default NOAH_VOICE_ID" > video/out/noah-check/source.txt; echo "SELECTED code-default NOAH_VOICE_ID"; }
      - name: Render the N1 sample and confirm the history voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_OUT: video/out/noah-check
          STORED_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          STORED_VOICE_ID_2: ${{ vars.ELEVENLABS_VOICE_ID_2 }}
        run: |
          set -euo pipefail
          export ELEVENLABS_VOICE_ID="$(cat "$RUNNER_TEMP/chosen-voice")"
          export VOICE_SOURCE="$(cat video/out/noah-check/source.txt)"
          python3 video/noah_voice_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: noah-voice-check
          path: video/out/noah-check/
          retention-days: 14
