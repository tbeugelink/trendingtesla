name: Publish pad 32-hour Short

# One reviewed file. Public on YouTube, then TikTok, Instagram and Facebook
# through Buffer with the AI-content label off. Does not post to X.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install --quiet pillow
      - name: Upload and queue
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_AI_GENERATED: "0"
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 video/pad-32/publish.py
