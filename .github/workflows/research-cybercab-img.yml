name: Research - Cybercab closing frame

on:
  push:
    branches: [research/story-short]
    paths: ["research/cybercab/gen_last.py"]

permissions:
  contents: write

jobs:
  img:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pip install --quiet pillow && python3 research/cybercab/gen_last.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add research/cybercab/out_img
          git commit -m "Research: Cybercab closing frame" && git pull --rebase -q origin research/story-short && git push || echo "nothing to commit"
