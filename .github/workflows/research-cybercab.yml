name: Research - Cybercab story Short audio

on:
  push:
    branches: [research/story-short]
    paths: ["research/cybercab/script.json", "research/cybercab/request.json", "research/cybercab/eleven.py"]

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Make voice and sound effects
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_3: ${{ vars.ELEVENLABS_VOICE_ID_3 }}
          VOICE_SLOT: "3"
          SPEED: "1.0"
          SPEED_PAYOFF: "0.95"
          PER_SPEED: "0:0.93,1:0.95,2:0.97"
          MAKE_SFX: "0"
          ONLY: "13,14"
        run: python3 research/cybercab/eleven.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add research/cybercab/out*
          git commit -m "Research: Cybercab Short audio" && git pull --rebase -q origin research/story-short && git push || echo "nothing to commit"
