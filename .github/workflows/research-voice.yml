name: Research - story Short audio

# Only runs on the research branch; makes ElevenLabs voice + sound effects and commits them back there.
on:
  push:
    branches: [research/story-short]
    paths: ["research/story/request.json", "research/story/script.json", "research/story/eleven.py"]

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Make voice and sound effects
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_2: ${{ vars.ELEVENLABS_VOICE_ID_2 }}
          MAKE_SFX: "0"
        run: python3 research/story/eleven.py
      - name: Commit results to the research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add research/story/out research/story/out_v2
          git commit -m "Research: story Short audio" && git push || echo "nothing to commit"
