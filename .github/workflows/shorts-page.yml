name: Update Shorts page

# Checks the public feed of the @TrendingTesla channel. As soon as a Short is public on YouTube,
# it is added to content/shorts.json and the /shorts/ pages are rebuilt and pushed (Cloudflare deploys).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-page
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Read YouTube feed
        id: sync
        run: |
          out=$(python3 tools/sync_shorts.py)
          echo "$out"
          [ "$out" = "changed" ] && echo "changed=1" >> "$GITHUB_OUTPUT" || true
      - name: Rebuild and push the Shorts pages
        if: steps.sync.outputs.changed == '1'
        run: |
          pip install --quiet pillow
          python3 build.py > /dev/null
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # only the Shorts pages change; other pages pick up shorts.json on the next normal build
          git add content/shorts.json public/shorts public/nl/shorts
          git commit -m "Shorts page: new YouTube Shorts"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
