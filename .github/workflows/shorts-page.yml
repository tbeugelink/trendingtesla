name: Update YouTube videos on site

# Checks the public feed of the @TrendingTesla channel. As soon as a video is public on YouTube,
# it is added to the site: Shorts go to content/shorts.json (/shorts/ page), long videos to content/videos.json (shown in
# their article); then the site is rebuilt and pushed (Cloudflare deploys).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-page
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Read YouTube feed
        id: sync
        run: |
          out=$(python3 tools/sync_shorts.py)
          echo "$out"
          [ "$out" = "changed" ] && echo "changed=1" >> "$GITHUB_OUTPUT" || true
      - name: Rebuild and push the site
        if: steps.sync.outputs.changed == '1'
        run: |
          pip install --quiet pillow
          python3 build.py > /dev/null
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keep the committed images (covers are made by the normal build; avoid re-encoding noise)
          git checkout -- $(git diff --name-only -- public | grep -E '\.(jpg|jpeg|png|webp)$') 2>/dev/null || true
          git add content/*.json public
          git commit -m "Site: new YouTube videos"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
