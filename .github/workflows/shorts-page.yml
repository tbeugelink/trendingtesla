name: Update YouTube videos on site

# Checks the public feed of the @TrendingTesla channel. As soon as a video is public on YouTube,
# it is added to the site: Shorts go to content/shorts.json (/shorts/ page), long videos to content/videos.json (shown in
# their article); then the site is rebuilt and pushed (Cloudflare deploys).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: shorts-page
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Story Shorts approved in YouTube Studio -> TikTok, Instagram, Facebook
        if: hashFiles('ops/story-pending.json') != ''
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '"id"' ops/story-pending.json; then command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }; fi
          out=$(python3 tools/story_approve.py); echo "$out"
          if echo "$out" | grep -qx changed; then
            git config user.name "TrendingTesla bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ops/story-pending.json && git commit -qm "Story Shorts: approved ones posted" && \
              (git pull --rebase -q origin main && git push -q origin HEAD:main) || true
          fi
      - name: Read YouTube feed
        id: sync
        run: |
          out=$(python3 tools/sync_shorts.py)
          echo "$out"
          [ "$out" = "changed" ] && echo "changed=1" >> "$GITHUB_OUTPUT" || true
      - name: Rebuild and push the site
        if: steps.sync.outputs.changed == '1'
        run: |
          pip install --quiet pillow
          python3 build.py > /dev/null
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keep the committed images (covers are made by the normal build; avoid re-encoding noise)
          git checkout -- $(git diff --name-only -- public | grep -E '\.(jpg|jpeg|png|webp)$') 2>/dev/null || true
          git add content/*.json public
          git commit -m "Site: new YouTube videos"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Watchdog - every article gets its Short and long video (retry once, then report)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(python3 tools/video_watchdog.py); echo "$out"
          if echo "$out" | grep -qx changed; then
            git config user.name "TrendingTesla bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add video/queue.txt ops/video-retries.json ops/video-problems.md 2>/dev/null
            git commit -qm "Watchdog: request missing video" && \
              (git pull --rebase -q origin main && git push -q origin HEAD:main) && \
              gh workflow run shorts.yml -f slug=queue || true
          fi
          echo "$out" | grep -q "::error::" && exit 1 || true
