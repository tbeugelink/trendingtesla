name: Make YouTube Shorts

# Runs when new articles are pushed (only for articles that have a "short" script),
# or by hand from the Actions tab for any article slug.
on:
  push:
    branches: [main]
    paths: ["content/articles/**.json"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug (without date)"
        required: true
      langs:
        description: "Languages, e.g. en or en nl"
        required: false
        default: "en"

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet pillow
      - name: Find articles
        id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slugs=${{ github.event.inputs.slug }}" >> "$GITHUB_OUTPUT"
            echo "langs=${{ github.event.inputs.langs }}" >> "$GITHUB_OUTPUT"
          else
            slugs=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- content/articles | while read f; do
              python3 -c "import json,sys; d=json.load(open('$f')); print(d['slug'] if d.get('short') else '')"; done | xargs)
            echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
            echo "langs=en" >> "$GITHUB_OUTPUT"
          fi
      - name: Make videos
        if: steps.find.outputs.slugs != ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "::error::Secret ELEVENLABS_API_KEY is empty or missing"; fi
          if [ -z "$ELEVENLABS_VOICE_ID" ]; then echo "::error::Variable ELEVENLABS_VOICE_ID is empty or missing"; fi
          fail=0
          for s in ${{ steps.find.outputs.slugs }}; do
            for l in ${{ steps.find.outputs.langs }}; do
              python3 video/short.py "$s" "$l" 2> err.txt || { fail=1; echo "::error::short.py $s $l failed: $(tail -c 600 err.txt | tr '\n' ' ')"; }
            done
          done
          exit $fail
      - name: Upload videos
        if: always() && steps.find.outputs.slugs != ''
        uses: actions/upload-artifact@v5
        with:
          name: shorts-${{ github.run_number }}
          path: |
            video/out/*.mp4
            video/out/*.txt
          retention-days: 30
