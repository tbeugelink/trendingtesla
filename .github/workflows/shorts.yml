name: Make YouTube videos

# Runs when new articles are pushed (only for articles that have a "short" script),
# or by hand from the Actions tab for any article slug.
on:
  push:
    branches: [main]
    paths: ["content/articles/**.json", "video/queue.txt"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug (without date)"
        required: true
      langs:
        description: "Languages, e.g. en or en nl"
        required: false
        default: "en"
      upload:
        description: "Upload the Short to YouTube (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet pillow num2words
      - name: Find articles
        id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.slug }}" = "queue" ]; then
            # started by the watchdog: make what video/queue.txt asks for (same as a push of that file)
            q=$(grep -v '^#' video/queue.txt | head -1)
            echo "slugs=$(echo "$q" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "langs=en" >> "$GITHUB_OUTPUT"
            echo "$q" | grep -q -- '--full' && echo "full=1" >> "$GITHUB_OUTPUT"
            echo "$q" | grep -q -- '--upload' && echo "upload=1" >> "$GITHUB_OUTPUT"
            echo "queue=1" >> "$GITHUB_OUTPUT"
            python3 tools/queue_story.py "$q" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slugs=${{ github.event.inputs.slug }}" >> "$GITHUB_OUTPUT"
            echo "langs=${{ github.event.inputs.langs }}" >> "$GITHUB_OUTPUT"
          else
            slugs=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- content/articles | while read f; do
              python3 -c "import json,sys; d=json.load(open('$f')); print(d['slug'] if d.get('short') else '')"; done | xargs)
            # every new article with a "video" script also gets a long video (made after the Short)
            longs=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- content/articles | while read f; do
              python3 -c "import json,sys; d=json.load(open('$f')); print(d['slug'] if (d.get('video') or {}).get('en') else '')"; done | xargs)
            echo "longs=$longs" >> "$GITHUB_OUTPUT"
            # articles with "short.story" get a story Short (video/story.py), uploaded private for William's review
            story=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- content/articles | while read f; do
              python3 -c "import json,sys; d=json.load(open('$f')); print(d['slug'] if (d.get('short') or {}).get('story') else '')"; done | xargs)
            echo "story=$story" >> "$GITHUB_OUTPUT"
            langs=en
            # video/queue.txt: first line "slug [langs]" requests a video on demand
            if git diff --name-only HEAD~1 HEAD | grep -qx video/queue.txt; then
              q=$(grep -v '^#' video/queue.txt | head -1)
              slugs=$(echo "$q" | awk '{print $1}')
              l=$(echo "$q" | cut -s -d' ' -f2- | tr ' ' '\n' | grep -v '^--' | xargs); [ -n "$l" ] && langs="$l"
              echo "$q" | grep -q -- '--full' && echo "full=1" >> "$GITHUB_OUTPUT"
              echo "$q" | grep -q -- '--upload' && echo "upload=1" >> "$GITHUB_OUTPUT"
              echo "queue=1" >> "$GITHUB_OUTPUT"
              python3 tools/queue_story.py "$q" >> "$GITHUB_OUTPUT"
            fi
            echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
            echo "langs=$langs" >> "$GITHUB_OUTPUT"
            # ops/videos-paused: articles still get their photos, but no Shorts or long videos are made or posted
            if [ -f ops/videos-paused ] && [ -z "$(git diff --name-only HEAD~1 HEAD | grep -x video/queue.txt)" ]; then echo "paused=1" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Generate article photos (Nano Banana) and publish them first
        if: steps.find.outputs.slugs != '' && steps.find.outputs.queue != '1' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'openai' }}
        run: |
          [ -z "$GEMINI_API_KEY" ] && exit 0
          python3 tools/gen_image.py ${{ steps.find.outputs.slugs }}
          [ -z "$(git status --porcelain content static ops/images-log.jsonl)" ] && exit 0
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 build.py > /dev/null
          git add -A content static PHOTOS.md public ops/images-log.jsonl
          git commit -qm "Photo: new image for ${{ steps.find.outputs.slugs }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
      - name: Add real, freely licensed news photos and publish them first
        if: steps.find.outputs.slugs != '' && steps.find.outputs.queue != '1' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: |
          python3 tools/real_photos.py ${{ steps.find.outputs.slugs }}
          [ -z "$(git status --porcelain content static)" ] && exit 0
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 build.py > /dev/null
          git add -A content static PHOTOS.md public
          git commit -qm "Photo: real news photo for ${{ steps.find.outputs.slugs }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
      - name: Make videos
        if: steps.find.outputs.slugs != '' && steps.find.outputs.paused != '1'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_NL: ${{ vars.ELEVENLABS_VOICE_ID_NL }}
          ELEVENLABS_VOICE_ID_3: ${{ vars.ELEVENLABS_VOICE_ID_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_VOICE: "1"
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "::error::Secret ELEVENLABS_API_KEY is empty or missing"; fi
          if [ -z "$ELEVENLABS_VOICE_ID" ]; then echo "::error::Variable ELEVENLABS_VOICE_ID is empty or missing"; fi
          fail=0
          for s in ${{ steps.find.outputs.slugs }}; do
            for l in ${{ steps.find.outputs.langs }}; do
              if [ "${{ steps.find.outputs.full }}" = "1" ]; then script=video/full.py; fmt=""; else script=video/short.py; fmt="--portrait"; fi
              if [ "$l" = "en" ] && [ "${{ steps.find.outputs.full }}" != "1" ] && echo " ${{ steps.find.outputs.story }} " | grep -q " $s "; then
                script=video/story.py; fmt=""; touch "video/out/$s-en-short.story" 2>/dev/null || { mkdir -p video/out; touch "video/out/$s-en-short.story"; }
              fi
              python3 $script "$s" "$l" $fmt 2> err.txt || { fail=1; echo "::error::$script $s $l failed: $(tail -c 600 err.txt | tr '\n' ' ')"; }
            done
          done
          exit $fail
      - name: Upload Shorts to YouTube
        if: steps.find.outputs.slugs != '' && steps.find.outputs.full != '1' && (steps.find.outputs.queue != '1' || steps.find.outputs.qstory == '1') && (github.event_name != 'workflow_dispatch' || github.event.inputs.upload == 'yes' || steps.find.outputs.qstory == '1') && steps.find.outputs.paused != '1'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "::warning::YouTube secrets missing, skipping upload"; exit 0; fi
          for f in video/out/*-en-short.mp4; do
            [ -f "$f" ] || continue
            if [ -f "${f%.mp4}.story" ]; then  # story Short: private for review, title as thumbnail, into the queue
              s=$(basename "$f" -en-short.mp4)
              YT_PRIVACY=public THUMB_AT=0.2 python3 video/upload.py "$f" en | tee up.txt
              id=$(grep -o 'youtu.be/[A-Za-z0-9_-]*' up.txt | head -1 | cut -d/ -f2)
              [ -n "$id" ] && echo "$id $s" >> "$RUNNER_TEMP/story-review"
            else
              python3 video/upload.py "$f" en
            fi
          done
          [ -f "$RUNNER_TEMP/story-review" ] || exit 0
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/story-review" "$RUNNER_TEMP/sr"
          for i in 1 2 3 4 5; do
            git stash -q 2>/dev/null; git fetch -q origin main && git reset -q --hard origin/main
            python3 -c "
          import json,datetime,pathlib
          p=pathlib.Path('ops/story-pending.json'); d=json.loads(p.read_text()) if p.exists() else []
          for ln in open('$RUNNER_TEMP/sr'):
              vid,slug=ln.split()
              d.append({'id':vid,'slug':slug,'run':${{ github.run_id }},'made':datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')})
          p.write_text(json.dumps(d,indent=1)+'\n')"
            git add ops/story-pending.json && git commit -qm "Story Short for review (public after 2 hours unless deleted)" && git push -q origin HEAD:main && break
            sleep 5
          done
          echo "### Story Short(s) for review: $(cat $RUNNER_TEMP/sr). Public after 2 hours unless deleted in YouTube Studio." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep story Shorts for the post after review
        if: steps.find.outputs.story != '' && steps.find.outputs.paused != '1'
        uses: actions/upload-artifact@v4
        with:
          name: story-${{ steps.find.outputs.story }}
          path: video/out/*-en-short.mp4
          retention-days: 14
      - name: Post Shorts to TikTok, Instagram and Facebook (via Buffer)
        if: steps.find.outputs.slugs != '' && steps.find.outputs.full != '1' && steps.find.outputs.queue != '1' && github.event_name != 'workflow_dispatch' && steps.find.outputs.paused != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |  # story Shorts are posted after the review instead (tools/story_approve.py)
          for f in video/out/*-en-short.mp4; do [ -f "$f" ] && [ ! -f "${f%.mp4}.story" ] && tools/tiktok_publish.sh "$f"; done; exit 0
      - name: Make and upload long videos
        if: steps.find.outputs.longs != '' && steps.find.outputs.queue != '1' && github.event_name != 'workflow_dispatch' && steps.find.outputs.paused != '1'
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_NL: ${{ vars.ELEVENLABS_VOICE_ID_NL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          fail=0
          for s in ${{ steps.find.outputs.longs }}; do
            python3 video/full.py "$s" en 2> err.txt || { fail=1; echo "::error::video/full.py $s en failed: $(tail -c 600 err.txt | tr '\n' ' ')"; continue; }
            [ -n "$YT_REFRESH_TOKEN" ] && python3 video/upload.py "video/out/$s-en-full.mp4" en || fail=1
          done
          exit $fail
      - name: Upload requested queue video to YouTube
        if: steps.find.outputs.queue == '1' && steps.find.outputs.upload == '1' && steps.find.outputs.qstory != '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: |
          for f in video/out/*.mp4; do [ -f "$f" ] && python3 video/upload.py "$f" "$(basename "$f" | sed -E 's/.*-(en|nl)-(full|short)\.mp4/\1/')"; done
      - name: Put the new videos on the site
        if: always() && steps.find.outputs.slugs != '' && steps.find.outputs.paused != '1'
        run: |
          ls video/out/*-short-report.txt >/dev/null 2>&1 || { [ -z "$(git status --porcelain content)" ] && exit 0; }
          git config user.name "TrendingTesla bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # other video runs may have pushed meanwhile: merge our new videos into the newest lists
          # (never a git merge of the JSON files, that conflicted when two runs overlapped)
          python3 tools/merge_video_lists.py save "$RUNNER_TEMP/vl"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/merge_video_lists.py apply "$RUNNER_TEMP/vl"
            # what the Short renderer actually did (overlay splits, contrast bands, timing, loop): read by the next task
            mkdir -p ops/short-reports
            for f in video/out/*-en-short-report.txt; do [ -f "$f" ] && cp "$f" "ops/short-reports/$(basename "$f" -en-short-report.txt).txt"; done
            [ -z "$(git status --porcelain content ops/short-reports)" ] && exit 0
            python3 build.py > /dev/null
            git checkout -- $(git diff --name-only -- public | grep -E '\.(jpg|jpeg|png|webp)$') 2>/dev/null || true
            git add content public ops/short-reports && git commit -qm "Site: new YouTube videos" && git push -q origin HEAD:main && exit 0
            sleep $((10 + RANDOM % 20))
          done
          exit 1
      - name: Upload videos
        if: always() && steps.find.outputs.slugs != '' && steps.find.outputs.paused != '1'
        uses: actions/upload-artifact@v5
        with:
          name: shorts-${{ github.run_number }}
          path: |
            video/out/*.mp4
            video/out/*.txt
          retention-days: 30
