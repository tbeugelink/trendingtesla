name: Post a Short to TikTok, Instagram and Facebook

# By hand from the Actions tab: post an existing Short to TikTok (via Buffer). New Shorts are posted
# automatically in "Make YouTube videos". The video is taken from the artifact of the run that made it.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug ('introspect' = list Buffer's post options, posts nothing)"
        required: true
      run_id:
        description: "Id of the 'Make YouTube videos' run whose artifact holds the Short"
        required: true
      services:
        description: "Networks (comma list)"
        required: false
        default: "tiktok,instagram,facebook"

permissions:
  contents: write
  actions: read

jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: List Buffer post options
        if: github.event.inputs.slug == 'introspect'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 tools/tiktok_post.py --introspect
      - name: Get the Short
        if: github.event.inputs.slug != 'introspect'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.event.inputs.run_id }}" -D art
          f=$(find art -name "${{ github.event.inputs.slug }}-en-short.mp4" | head -1)
          [ -n "$f" ] || { echo "::error::Short not found in that run"; exit 1; }
          mkdir -p video/out && cp "$f" video/out/
      - name: Post to TikTok
        if: github.event.inputs.slug != 'introspect'
        env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SOCIAL_SERVICES: ${{ github.event.inputs.services }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet pillow
          tools/tiktok_publish.sh video/out/*-en-short.mp4
