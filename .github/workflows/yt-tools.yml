name: YouTube tools

# By hand from the Actions tab: set thumbnails for existing long videos (opening frame with the label).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Video ids (space separated); empty = all long videos on the site"
        required: false
        default: ""

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet pillow num2words
      - name: Set thumbnails
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/yt_thumbs.py ${{ github.event.inputs.ids }}
