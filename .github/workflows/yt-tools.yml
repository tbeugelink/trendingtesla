name: YouTube tools

# By hand from the Actions tab: thumbnails (opening frame with the label) and/or topic playlists for
# the existing long videos.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "thumbs, playlists, both or stats"
        required: false
        default: "both"
      ids:
        description: "Video ids (space separated); empty = all long videos on the site"
        required: false
        default: ""

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet pillow num2words
      - name: Set thumbnails
        if: github.event.inputs.action == 'thumbs' || github.event.inputs.action == 'both'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/yt_thumbs.py ${{ github.event.inputs.ids }}
      - name: Topic playlists
        if: github.event.inputs.action == 'playlists' || github.event.inputs.action == 'both'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/yt_playlists.py
      - name: Video statistics
        if: github.event.inputs.action == 'stats'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/yt_stats.py
