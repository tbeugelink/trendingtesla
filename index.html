<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trending Tesla</title>
<meta name="description" content="Trending Tesla — coming soon.">
<style>
  :root { --bg:#0b0d10; --fg:#e8eaed; --muted:#9aa0a6; --accent:#e31937; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; text-align:center; }
  h1 { font-size:clamp(2rem,6vw,3.5rem); letter-spacing:-0.02em; }
  h1 span { color:var(--accent); }
  p { color:var(--muted); margin-top:12px; font-size:1.1rem; }
</style>
</head>
<body>
  <main>
    <h1>Trending<span>Tesla</span></h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
